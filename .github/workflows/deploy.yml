name: Deploy to Hostinger via SFTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://ccischool.org

      - name: Deploy to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST || secrets.FTP_SERVER || '187.124.193.92' }}
          username: ${{ secrets.SFTP_USER || secrets.FTP_USER }}
          password: ${{ secrets.SFTP_PASS || secrets.FTP_PASS }}
          port: ${{ secrets.SFTP_PORT || 65002 }}
          local_path: './out/*'
          remote_path: ${{ secrets.SFTP_DIR || secrets.FTP_DIR || '/home/u460407084/domains/ccischool.org/public_html/' }}
          sftp_only: true
          delete_remote_files: false


