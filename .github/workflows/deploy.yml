name: Deploy to Hostinger via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Fail fast with a clear message instead of building first and then
      # getting "530 Login incorrect" from the deploy action.
      - name: Check FTP login
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::The FTP_USER or FTP_PASS repository secret is missing or empty."
            exit 1
          fi
          # Describe the secrets without printing them.
          bad=0
          if [[ "$FTP_USER" =~ ^[[:space:]]|[[:space:]]$ ]]; then
            echo "::error::FTP_USER has a space or line break at the start or end. Re-paste it without one."; bad=1
          fi
          if [[ "$FTP_PASS" =~ ^[[:space:]]|[[:space:]]$ ]]; then
            echo "::error::FTP_PASS has a space or line break at the start or end. Re-paste it without one."; bad=1
          fi
          if [[ "$FTP_USER" =~ ^u[0-9]+(\.[A-Za-z0-9.-]+)?$ ]]; then
            echo "FTP_USER format looks like a Hostinger FTP username (${#FTP_USER} characters)."
          else
            echo "::error::FTP_USER doesn't look like a Hostinger FTP username (u123456789 or u123456789.something). Copy it from hPanel > Files > FTP Accounts, not the hPanel login email."; bad=1
          fi
          [ "$bad" = 0 ] || exit 1
          if ! curl --silent --show-error --list-only --max-time 30 \
               --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_SERVER/" > /dev/null; then
            echo "::error::FTP login to $FTP_SERVER was rejected. The username format is fine, so the password doesn't match this FTP account (a newly changed password can take a few minutes to apply in Hostinger)."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://ccischool.org

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftp
          log-level: verbose
          local-dir: ./out/
          # Relative to the folder the FTP account opens in.
          server-dir: public_html/
          timeout: 600000
