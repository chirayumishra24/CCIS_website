name: Deploy to Hostinger via SFTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://ccischool.org
          # Public Firebase web config (shipped to browsers anyway); overrides the stale values in .env
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyC5MjTbXMpHgVFyTLAsISxKolDN9w0h9Kc
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:1011375873388:web:0c4946475173d55008e749

      - name: Deploy to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          port: ${{ secrets.SFTP_PORT }}
          local_path: "./out/*"
          remote_path: "/home/u460407084/domains/ccischool.org/public_html/"
          sftp_only: true
          delete_remote_files: false


