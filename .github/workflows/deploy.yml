name: Deploy to Hostinger via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FTP_SERVER: 187.124.193.92

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Fail fast with a clear message instead of building first and then
      # getting "530 Login incorrect" from the deploy action.
      - name: Check FTP login
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::The FTP_USER or FTP_PASS repository secret is missing or empty."
            exit 1
          fi
          if ! listing=$(curl --silent --show-error --list-only --max-time 30 \
                 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_SERVER/"); then
            echo "::error::FTP login to $FTP_SERVER was rejected. Copy the username and password from hPanel > ccischool.org > Files > FTP Accounts into the FTP_USER and FTP_PASS secrets."
            exit 1
          fi
          # The site is uploaded to public_html/ccischool relative to the FTP
          # account's root, so that root must contain public_html.
          if ! printf '%s\n' "$listing" | grep -qx 'public_html'; then
            echo "::error::No public_html folder at this FTP account's root. In hPanel, use an FTP account whose directory contains public_html."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://ccischool.org

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftp
          local-dir: ./out/
          # Relative to the FTP account's root (FTP logins can't see /home/...).
          server-dir: public_html/ccischool/
          timeout: 600000
